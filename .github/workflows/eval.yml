name: EvalForge Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('EvalForge/requirements.txt') }}

      - name: Install dependencies
        working-directory: EvalForge
        run: pip install -r requirements.txt

      - name: Unit tests (offline)
        working-directory: EvalForge
        run: python -m pytest -q

      - name: Demo run (mock, offline)
        working-directory: EvalForge
        env:
          MOCK_MODE: "true"
        run: python run_regression.py

      - name: Run regression tests
        working-directory: EvalForge
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MOCK_MODE: "false"
          PROVIDER: "groq"
          MODEL: "openai/gpt-oss-120b"
          JUDGE_MODEL: "qwen/qwen3.8-27b"
          BASELINE_RUN_ID: ${{ secrets.BASELINE_RUN_ID }}
          MAX_CONCURRENT_CALLS: "1"
          JUDGE_TEMPERATURE: "0.0"
        run: python run_regression.py

      - name: Commit dashboard data
        if: always() && github.event_name == 'push'
        working-directory: EvalForge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard_data.json
          git diff --staged --quiet || git commit -m "chore: update dashboard data [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Upload dashboard site
        if: always() && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: EvalForge/docs

  # Separate job: the github-pages environment only accepts the default branch,
  # so PR runs must never reference it. Deploys even when a regression fails the
  # tests above, so the dashboard shows the regression.
  deploy-dashboard:
    needs: regression-tests
    if: always() && github.event_name == 'push' && needs.regression-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
